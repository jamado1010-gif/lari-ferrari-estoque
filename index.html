<meta charset="UTF-8">
<title>Lari Ferrari</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --accent: #d1477c;
    --accent-ink: #ffffff;
    --accent-soft: #f8d3e3;
    --accent-soft-ink: #97295a;
    --logo-bg: #f8d3e3;
    --logo-ink: #201316;

    --bg: #fdf8f9;
    --surface: #ffffff;
    --surface-2: #fff5f7;
    --border: #f0dde3;
    --border-strong: #e3c6cf;

    --text: #2b1620;
    --text-2: #7a6067;
    --text-muted: #a3888f;

    --good: #0ca30c;
    --good-soft: #e3f6e3;
    --warning: #b3760a;
    --warning-soft: #fdedc9;
    --critical: #d03b3b;
    --critical-soft: #fbe1e1;

    --series-ganho: #008300;
    --series-gasto: #e34948;

    --shadow: 0 1px 2px rgba(43,22,32,0.06), 0 8px 24px -8px rgba(43,22,32,0.12);
    --shadow-lg: 0 4px 8px rgba(43,22,32,0.08), 0 20px 40px -12px rgba(43,22,32,0.22);
    --radius: 16px;
    --radius-sm: 10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --accent: #f472a0;
      --accent-ink: #2b0a17;
      --accent-soft: #3a1826;
      --accent-soft-ink: #f9b8ce;

      --bg: #180f13;
      --surface: #241419;
      --surface-2: #2b171d;
      --border: #3a2530;
      --border-strong: #4a2f3b;

      --text: #f7ecef;
      --text-2: #c9b3bb;
      --text-muted: #8f7780;

      --good: #35c95f;
      --good-soft: #163420;
      --warning: #fab219;
      --warning-soft: #3a2b0c;
      --critical: #e66767;
      --critical-soft: #3a1a1a;

      --series-ganho: #35c95f;
      --series-gasto: #e66767;

      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);
      --shadow-lg: 0 4px 8px rgba(0,0,0,0.35), 0 20px 40px -12px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --accent: #f472a0;
    --accent-ink: #2b0a17;
    --accent-soft: #3a1826;
    --accent-soft-ink: #f9b8ce;

    --bg: #180f13;
    --surface: #241419;
    --surface-2: #2b171d;
    --border: #3a2530;
    --border-strong: #4a2f3b;

    --text: #f7ecef;
    --text-2: #c9b3bb;
    --text-muted: #8f7780;

    --good: #35c95f;
    --good-soft: #163420;
    --warning: #fab219;
    --warning-soft: #3a2b0c;
    --critical: #e66767;
    --critical-soft: #3a1a1a;

    --series-ganho: #35c95f;
    --series-gasto: #e66767;

    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -8px rgba(0,0,0,0.5);
    --shadow-lg: 0 4px 8px rgba(0,0,0,0.35), 0 20px 40px -12px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    margin:0;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3,.display{
    font-family:"Quicksand", "Inter", system-ui, sans-serif;
    font-weight:700;
    letter-spacing:-0.01em;
    text-wrap:balance;
    margin:0;
  }
  .tabular{ font-variant-numeric: tabular-nums; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; }

  #app{
    max-width: 640px;
    margin: 0 auto;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    background: var(--bg);
    position:relative;
  }

  /* ---------- Header ---------- */
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px;
    padding: max(14px, env(safe-area-inset-top)) 18px 14px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom:1px solid var(--border);
  }
  .topbar .brand{ display:flex; align-items:center; gap:10px; }
  .topbar .brand .mark{
    width:36px; height:36px; border-radius:50%;
    background: var(--logo-bg);
    display:flex; align-items:center; justify-content:center;
    flex:none;
    box-shadow: var(--shadow);
    overflow:hidden;
  }
  .topbar .brand .mark svg{ width:100%; height:100%; display:block; }
  .topbar .brand .mark .lf{
    font-family:"Playfair Display", "Quicksand", serif;
    font-style:italic; font-weight:600; font-size:15px;
    fill: var(--logo-ink);
  }
  .topbar h1{ font-family:"Playfair Display","Quicksand","Inter",serif; font-style:italic; font-size:20px; letter-spacing:0; }
  .topbar .sub{ font-size:11.5px; color:var(--text-muted); font-weight:500; margin-top:1px; }
  .icon-btn{
    width:38px; height:38px; border-radius:12px;
    border:1px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; color:var(--text-2); cursor:pointer; flex:none;
  }
  .icon-btn:active{ transform:scale(0.95); }

  main{ flex:1; padding: 16px 18px calc(96px + env(safe-area-inset-bottom)); }
  .view{ display:none; animation: fade .18s ease; }
  .view.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .periodo-box{
    display:flex; gap:9px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:12px 13px; margin-bottom:16px;
  }
  .periodo-col{ flex:1; min-width:0; }
  .periodo-col .lbl{
    font-size:10px; font-weight:700; color:var(--text-muted); text-transform:uppercase;
    letter-spacing:.05em; margin-bottom:6px;
  }
  .periodo-col select{
    width:100%; padding:9px 8px; border-radius:10px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:12.5px; font-weight:700;
    outline:none; text-overflow:ellipsis;
  }
  .periodo-col select:disabled{ opacity:.45; }

  /* ---------- Stat tiles ---------- */
  .stats-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; }
  .stat-tile{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:13px 14px; display:flex; flex-direction:column; gap:4px;
  }
  .stat-tile .label{ font-size:11.5px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .stat-tile .value{ font-size:19px; font-weight:700; }
  .stat-tile .value.good{ color:var(--good); }
  .stat-tile .value.critical{ color:var(--critical); }

  section.block{ margin-bottom:24px; }
  .block-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
  .block-head h2{ font-size:16px; }
  .block-head a.link{ font-size:12.5px; color:var(--accent); font-weight:600; cursor:pointer; }

  /* ---------- Search ---------- */
  .search-row{ position:relative; margin-bottom:14px; }
  .search-row input{
    width:100%; padding:11px 14px 11px 36px; border-radius:12px;
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    font-size:14.5px; outline:none;
  }
  .search-row input:focus{ border-color:var(--accent); }
  .search-row .ic{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:14px; }

  .filter-chips{
    display:flex; gap:7px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;
    scrollbar-width:none;
  }
  .filter-chips::-webkit-scrollbar{ display:none; }
  .filter-chip{
    flex:none; border:1px solid var(--border); background:var(--surface);
    color:var(--text-2); font-size:12.5px; font-weight:700; padding:7px 13px;
    border-radius:99px; cursor:pointer; white-space:nowrap;
  }
  .filter-chip.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }

  /* ---------- Cards / lists ---------- */
  .list{ display:flex; flex-direction:column; gap:9px; }
  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:13px 14px; display:flex; flex-direction:column; gap:8px;
  }
  .card.flash{ animation: flashCard 1.6s ease; }
  @keyframes flashCard{
    0%{ background:var(--accent-soft); border-color:var(--accent); }
    100%{ background:var(--surface); border-color:var(--border); }
  }
  .card-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .card-title{ font-size:15px; font-weight:600; color:var(--text); }
  .card-meta{ font-size:12.5px; color:var(--text-2); margin-top:2px; }
  .chip{
    display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:99px;
    font-size:11.5px; font-weight:700; white-space:nowrap;
  }
  .chip.good{ background:var(--good-soft); color:var(--good); }
  .chip.warning{ background:var(--warning-soft); color:var(--warning); }
  .chip.critical{ background:var(--critical-soft); color:var(--critical); }
  .chip.neutral{ background:var(--surface-2); color:var(--text-2); border:1px solid var(--border); }
  .chip.accent{ background:var(--accent-soft); color:var(--accent-soft-ink); }

  .card-actions{ display:flex; gap:8px; }
  .btn{
    border:none; border-radius:10px; padding:8px 13px; font-size:13px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; justify-content:center;
  }
  .btn:active{ transform:scale(0.97); }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); }
  .btn.soft{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
  .btn.ghost{ background:transparent; color:var(--text-2); border:1px solid var(--border); }
  .btn.danger{ background:var(--critical-soft); color:var(--critical); }
  .btn.block{ width:100%; }
  .btn.lg{ padding:13px 16px; font-size:14.5px; border-radius:12px; }

  .price-row{ display:flex; gap:16px; }
  .price-row .item .k{ font-size:11px; color:var(--text-muted); font-weight:600; }
  .price-row .item .v{ font-size:14px; font-weight:700; }

  .empty-state{
    text-align:center; padding:38px 20px; color:var(--text-2);
    border:1.5px dashed var(--border-strong); border-radius:var(--radius);
  }
  .empty-state .emoji{ font-size:30px; display:block; margin-bottom:10px; }
  .empty-state p{ margin:0 0 14px; font-size:13.5px; line-height:1.5; }

  /* ---------- Bottom tab bar ---------- */
  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    display:flex; justify-content:center;
  }
  nav.tabbar .inner{
    width:100%; max-width:640px; display:flex;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(14px);
    border-top:1px solid var(--border);
    padding: 6px 10px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center;
    gap:3px; padding:7px 4px 4px; color:var(--text-muted); cursor:pointer; border-radius:12px;
  }
  nav.tabbar button .tico{ font-size:19px; line-height:1; }
  nav.tabbar button .tlabel{ font-size:10.5px; font-weight:700; }
  nav.tabbar button.active{ color:var(--accent); }

  .fab{
    position:fixed; z-index:25; right:calc(50% - 320px + 18px);
    bottom:calc(74px + env(safe-area-inset-bottom));
    width:54px; height:54px; border-radius:17px; border:none;
    background:var(--accent); color:var(--accent-ink); font-size:24px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: var(--shadow-lg); cursor:pointer;
  }
  @media (max-width:676px){ .fab{ right:18px; } }
  .fab:active{ transform:scale(0.94); }

  /* ---------- Sheet / modal ---------- */
  .backdrop{
    position:fixed; inset:0; background:rgba(20,10,14,0.45); z-index:40;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .backdrop.open{ opacity:1; pointer-events:auto; }
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    max-width:640px; margin:0 auto;
    background:var(--surface); border-radius:20px 20px 0 0;
    box-shadow:var(--shadow-lg); border:1px solid var(--border); border-bottom:none;
    max-height:88dvh; display:flex; flex-direction:column;
    transform:translateY(102%); transition:transform .25s cubic-bezier(.32,.72,0,1);
  }
  .sheet.open{ transform:translateY(0); }
  .sheet-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 10px; border-bottom:1px solid var(--border); flex:none;
  }
  .sheet-head h3{ font-size:16.5px; }
  .sheet-body{ padding:16px 18px calc(20px + env(safe-area-inset-bottom)); overflow-y:auto; }
  .sheet-close{ background:var(--surface-2); border:1px solid var(--border); width:30px; height:30px; border-radius:50%; color:var(--text-2); font-size:14px; cursor:pointer; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--text-2); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; padding:11px 13px; border-radius:11px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text); font-size:15px; outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--accent); background:var(--surface); }
  .field textarea{ resize:vertical; min-height:60px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field-hint{ font-size:11.5px; color:var(--text-muted); margin-top:5px; }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }

  .toast{
    position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px); z-index:50;
    background:var(--text); color:var(--bg); padding:11px 18px; border-radius:12px;
    font-size:13.5px; font-weight:600; box-shadow:var(--shadow-lg); opacity:0; transition:all .25s ease;
    pointer-events:none; max-width:88%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Chart ---------- */
  .chart-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 14px 10px; }
  .legend{ display:flex; gap:16px; margin-bottom:10px; padding-left:2px; }
  .legend-item{ display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--text-2); }
  .legend-dot{ width:9px; height:9px; border-radius:3px; }
  .bars-scroll{ overflow-x:auto; }
  .bars-scroll svg{ display:block; width:100%; height:auto; }

  .hbar-list{ display:flex; flex-direction:column; gap:11px; }
  .hbar-row .hbar-top{ display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:5px; }
  .hbar-row .hbar-top .name{ font-weight:600; color:var(--text); }
  .hbar-row .hbar-top .qty{ color:var(--text-2); font-weight:600; }
  .hbar-track{ height:8px; border-radius:5px; background:var(--surface-2); overflow:hidden; }
  .hbar-fill{ height:100%; border-radius:5px; background:var(--accent); }

  .kv-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--border); }
  .kv-row:last-child{ border-bottom:none; }
  .kv-row .k{ font-size:13.5px; color:var(--text-2); font-weight:500; }
  .kv-row .v{ font-size:14.5px; font-weight:700; }

  .cat-menu{ display:flex; flex-direction:column; }
  .cat-menu button{
    display:flex; align-items:center; gap:14px; width:100%; border:none;
    background:transparent; padding:14px 2px; font-size:16px; color:var(--text);
    border-bottom:1px solid var(--border); text-align:left; cursor:pointer;
  }
  .cat-menu button:last-child{ border-bottom:none; }
  .cat-menu .cm-icon{ font-size:19px; width:24px; text-align:center; flex:none; }
  .cat-menu .cm-label{ flex:1; font-weight:500; }
  .cat-menu .cm-chevron{ color:var(--accent); font-size:16px; flex:none; }
  .cat-menu button.cm-all{ font-weight:700; color:var(--accent); }

  .help-box{
    background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    padding:12px 13px; font-size:12.5px; color:var(--text-2); line-height:1.55; margin-bottom:16px;
  }
  .help-box b{ color:var(--text); }
</style>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg" aria-label="Lari Ferrari Nails Designer">
          <circle cx="18" cy="18" r="18" fill="var(--logo-bg)"></circle>
          <text class="lf" x="18" y="24" text-anchor="middle">LF</text>
        </svg>
      </div>
      <div>
        <h1 id="page-title">Estoque</h1>
        <div class="sub" id="page-sub">seus produtos Wepink</div>
      </div>
    </div>
    <button class="icon-btn" id="btn-menu" title="Backup e ajustes">⚙️</button>
  </header>

  <main>
    <!-- ESTOQUE -->
    <section class="view active" id="view-estoque">
      <div class="stats-grid">
        <div class="stat-tile">
          <div class="label">Produtos cadastrados</div>
          <div class="value tabular" id="st-total-produtos">0</div>
        </div>
        <div class="stat-tile">
          <div class="label">Estoque baixo</div>
          <div class="value tabular" id="st-baixo">0</div>
        </div>
      </div>

      <div class="help-box" id="banner-backup" style="display:none;background:var(--warning-soft);"></div>
      <div class="help-box" id="banner-conferir" style="display:none;"></div>

      <div class="search-row">
        <span class="ic">🔎</span>
        <input type="text" id="search-produtos" placeholder="Buscar produto...">
      </div>

      <div class="filter-chips" id="filtro-categoria"></div>

      <div class="list" id="lista-produtos"></div>
    </section>

    <!-- PAINEL -->
    <section class="view" id="view-painel">
      <div class="block">
        <div class="periodo-box" id="periodo-box"></div>
        <div class="stats-grid">
          <div class="stat-tile">
            <div class="label">Ganho c/ produtos</div>
            <div class="value good tabular" id="pn-ganho">R$ 0</div>
          </div>
          <div class="stat-tile">
            <div class="label">Gasto c/ produtos</div>
            <div class="value critical tabular" id="pn-gasto">R$ 0</div>
          </div>
          <div class="stat-tile" style="grid-column:1 / -1;">
            <div class="label">Lucro c/ produtos</div>
            <div class="value tabular" id="pn-lucro">R$ 0</div>
          </div>
        </div>
      </div>

      <div class="block">
        <div class="block-head"><h2>Últimos 12 meses</h2></div>
        <div class="chart-card">
          <div class="legend">
            <div class="legend-item"><span class="legend-dot" style="background:var(--series-ganho)"></span>Ganho</div>
            <div class="legend-item"><span class="legend-dot" style="background:var(--series-gasto)"></span>Gasto</div>
          </div>
          <div class="bars-scroll"><svg id="chart-meses" width="560" height="180"></svg></div>
        </div>
      </div>

      <div class="block">
        <div class="block-head"><h2>Valor em estoque</h2></div>
        <div class="chart-card">
          <div class="kv-row"><span class="k">Investido (preço de custo)</span><span class="v tabular" id="pn-investido">R$ 0</span></div>
          <div class="kv-row"><span class="k">Potencial de venda</span><span class="v tabular" id="pn-potencial">R$ 0</span></div>
        </div>
      </div>

      <div class="block">
        <div class="block-head"><h2>Mais vendidos</h2></div>
        <div class="chart-card" id="card-mais-vendidos">
          <div class="hbar-list" id="lista-mais-vendidos"></div>
        </div>
      </div>

      <div class="block" id="block-baixo-estoque" style="display:none;">
        <div class="block-head"><h2>Estoque baixo</h2><a class="link" data-goto="estoque">ver estoque →</a></div>
        <div class="list" id="lista-baixo-painel"></div>
      </div>
    </section>
  </main>

  <button class="fab" id="fab-add">+</button>

  <nav class="tabbar">
    <div class="inner">
      <button data-tab="estoque" class="active"><span class="tico">📦</span><span class="tlabel">Estoque</span></button>
      <button data-tab="painel"><span class="tico">📊</span><span class="tlabel">Painel</span></button>
    </div>
  </nav>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="toast" id="toast"></div>

<!-- ============== SHEETS (templates injected via JS) ============== -->
<div id="sheet-root"></div>

<script>
(function(){
  "use strict";

  /* ===================== Storage ===================== */
  var STORE_KEY = "vitrine_estoque_agenda_v1";
  var LAST_BACKUP_KEY = "vitrine_last_backup_v1";
  function getLastBackupTime(){ return parseInt(localStorage.getItem(LAST_BACKUP_KEY) || "0", 10); }
  function markBackupDone(){ try{ localStorage.setItem(LAST_BACKUP_KEY, String(Date.now())); }catch(e){} }
  var db = { products: [], movements: [] };

  var KNOWN_CATEGORIES = ["Kits","Bath&Body","Body Splash","Perfumaria","Skincare","Body Cream","The Cream","Make","Hair","Roll-On","Infantil","Cápsulas","Chás","Vitaminas","Treino","Creatinas","Colágenos","Whey"];
  var CATEGORY_ICONS = {
    "Kits":"🎁","Bath&Body":"🛁","Body Splash":"💦","Perfumaria":"🌷","Skincare":"🧴",
    "Body Cream":"🍯","The Cream":"🍦","Make":"💄","Hair":"💇‍♀️","Roll-On":"🧊",
    "Infantil":"🧸","Cápsulas":"💊","Chás":"🍵","Vitaminas":"🌿","Treino":"🏋️",
    "Creatinas":"⚡","Colágenos":"🧬","Whey":"🥛"
  };

  var SEED_PRODUCTS = (function(){
    var cats = {
      "Body Cream": ["VF Golden","Heaven Blue","My We Belle","Eternal (manteiga)","Liberté Exclusif","Heaven Santal e Fig","Fuivê Celestial","Fatal Black","One Touch Latte","Heaven Bride","Liberté","Ruby Rhodolite","Auretra","Infinity Tawny","The Fairy","Cassera","Vanilla Dream","Vanilla Hope","Vanilla Cuddle","Laterna","Ultimate Sunset","Pureblizz","Lion Blanc","VF Chaos","Obsessed Lovely","Red Obsidian","Obsessed Deluxe","One Touch Warm","Queen Mint","Slay Star","Crave","Crave Lovely","Infinity Zeus","Obsessed Pink","Capri","Universe Moon","Fusion For Him","Martini","Castillo","Never Strong","Ghadan","Fatal Rouge","Queen Pink"],
      "Body Splash": ["Merry Christmas","Heaven Groom","Wonbloom","Wonbloom Charm","VF Golden","Heaven Blue","My We Belle","VF 1","One Touch","Infinity","Heaven","King Blue","Perfect Pear"],
      "Perfumaria": ["Louvre Green","VF 2.7","Laterna","Blouten","Vallora Spell","VF Tropical","Authentic Azure","Brave Element","Venice Breeze","Scarlette","Perfect Pear e Peach","Heaven Santal","Fatal Black","Scarlette Radiance","Yasmin Sadiq","Obsessed Intense","Ruby Amethyst","Pure Pear","Fuivê Celestial","Liberté Doré","Ember Divinus","Crimson Seraph","Liberté Platiné","Ruby Rhodolite","Flora Whisper","Fatal White","Bourbon","Red Mirage","Wonderful","Celebrate Life","Liberté","Obsessed","Red","VF Bloom","Ruby","One Touch Silk","Liberté Exclusif","King Blue Deep","Heaven Bride","Mallorie Luxury","Tyrie Royale","Merry Christmas","Heaven Groom","Red Obsidian","Brave","King Blue Supreme","Authentic","Capri","Pear e Peach","VF Choice's Delight","Fatal Black","VF Onix","Obsessed","Absolute"],
      "Infantil": ["My Kids","Fantasy Kids (Blue Dragon)","Fantasy Kids (Dream Land)"]
    };
    var out = [];
    Object.keys(cats).forEach(function(cat){
      var seen = {};
      cats[cat].forEach(function(name){
        var key = name.toLowerCase();
        if(seen[key]) return;
        seen[key] = true;
        out.push({ id: "seed_" + cat.replace(/\s+/g,"") + "_" + out.length, name: name, category: cat, costPrice: 0, salePrice: 0, quantity: 0, minStock: 1, unset: true, createdAt: Date.now() });
      });
    });
    return out;
  })();

  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        db.products = parsed.products || [];
        db.movements = parsed.movements || [];
      } else {
        db.products = SEED_PRODUCTS.slice();
        save();
      }
    }catch(e){ console.error("Falha ao carregar dados", e); }
  }
  function save(){
    localStorage.setItem(STORE_KEY, JSON.stringify(db));
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  /* ===================== Helpers ===================== */
  function fmtMoney(n){
    n = Number(n)||0;
    return "R$ " + n.toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtDateShort(iso){
    if(!iso) return "";
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString("pt-BR", {day:"2-digit", month:"short"});
  }
  function todayISO(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function monthKey(iso){ return (iso||"").slice(0,7); }
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  /* ===================== Tabs ===================== */
  var TITLES = {
    estoque: ["Estoque", "seus produtos Wepink"],
    painel: ["Painel", "seus números"]
  };
  var currentTab = "estoque";
  var estoqueCategoriaFiltro = "todas";
  var painelAno = todayISO().slice(0,4);
  var painelMes = todayISO().slice(5,7);
  var painelDia = "todos";

  function setTab(tab){
    currentTab = tab;
    document.querySelectorAll(".view").forEach(function(v){ v.classList.remove("active"); });
    document.getElementById("view-" + tab).classList.add("active");
    document.querySelectorAll("nav.tabbar button").forEach(function(b){
      b.classList.toggle("active", b.dataset.tab === tab);
    });
    document.getElementById("page-title").textContent = TITLES[tab][0];
    document.getElementById("page-sub").textContent = TITLES[tab][1];
    document.getElementById("fab-add").style.display = tab === "estoque" ? "flex" : "none";
    renderAll();
  }
  document.querySelectorAll("nav.tabbar button").forEach(function(b){
    b.addEventListener("click", function(){ setTab(b.dataset.tab); });
  });
  document.querySelectorAll("[data-goto]").forEach(function(el){
    el.addEventListener("click", function(){ setTab(el.dataset.goto); });
  });

  /* ===================== FAB ===================== */
  document.getElementById("fab-add").addEventListener("click", function(){
    if(currentTab === "estoque") openProdutoSheet();
  });

  document.getElementById("btn-menu").addEventListener("click", openBackupSheet);

  /* ===================== Sheet system ===================== */
  var backdrop = document.getElementById("backdrop");
  var sheetRoot = document.getElementById("sheet-root");
  var activeSheetEl = null;

  function openSheet(html){
    sheetRoot.innerHTML = html;
    var sheet = sheetRoot.querySelector(".sheet");
    activeSheetEl = sheet;
    backdrop.classList.add("open");
    requestAnimationFrame(function(){ sheet.classList.add("open"); });
    backdrop.onclick = closeSheet;
    sheet.querySelectorAll("[data-close]").forEach(function(el){ el.addEventListener("click", closeSheet); });
    return sheet;
  }
  function closeSheet(){
    if(!activeSheetEl) return;
    activeSheetEl.classList.remove("open");
    backdrop.classList.remove("open");
    setTimeout(function(){ sheetRoot.innerHTML = ""; activeSheetEl = null; }, 250);
  }

  function confirmDialog(title, msg, okLabel, onOk, danger){
    var sheet = openSheet(
      '<div class="sheet open">' +
        '<div class="sheet-head"><h3>' + escapeHtml(title) + '</h3><button class="sheet-close" data-close>✕</button></div>' +
        '<div class="sheet-body">' +
          '<p style="font-size:14px;color:var(--text-2);line-height:1.5;margin:0 0 18px;">' + escapeHtml(msg) + '</p>' +
          '<div class="sheet-actions">' +
            '<button class="btn ghost block" data-close>Cancelar</button>' +
            '<button class="btn block ' + (danger?"danger":"primary") + '" id="confirm-ok">' + escapeHtml(okLabel) + '</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
    sheet.querySelector("#confirm-ok").addEventListener("click", function(){ closeSheet(); onOk(); });
  }

  /* ===================== ESTOQUE: render ===================== */
  function stockStatus(p){
    if(p.unset) return "neutral";
    if(p.quantity <= 0) return "critical";
    if(p.quantity <= p.minStock) return "warning";
    return "good";
  }
  function stockLabel(p){
    if(p.unset) return "Conferir estoque";
    if(p.quantity <= 0) return "Esgotado";
    if(p.quantity <= p.minStock) return "Estoque baixo";
    return "Em estoque";
  }

  function renderFiltroCategoria(){
    var el = document.getElementById("filtro-categoria");
    if(estoqueCategoriaFiltro === "todas"){
      el.innerHTML = '<button class="filter-chip" data-action="abrir">☰ Categorias</button>';
      return;
    }
    var icon = CATEGORY_ICONS[estoqueCategoriaFiltro] || "✨";
    el.innerHTML =
      '<button class="filter-chip active" data-action="abrir">' + icon + ' ' + escapeHtml(estoqueCategoriaFiltro) + '</button>' +
      '<button class="filter-chip" data-action="limpar">Ver todas ✕</button>';
  }
  document.getElementById("filtro-categoria").addEventListener("click", function(e){
    var btn = e.target.closest(".filter-chip"); if(!btn) return;
    if(btn.dataset.action === "limpar"){ estoqueCategoriaFiltro = "todas"; renderEstoque(); }
    else { openCategoriasSheet(); }
  });

  function highlightProduct(id){
    var el = document.querySelector('.card[data-id="' + id + '"]');
    if(!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "center" });
    el.classList.remove("flash");
    void el.offsetWidth;
    el.classList.add("flash");
    setTimeout(function(){ el.classList.remove("flash"); }, 1700);
  }

  function renderEstoque(){
    renderFiltroCategoria();
    var q = (document.getElementById("search-produtos").value || "").trim().toLowerCase();
    var list = db.products.slice().sort(function(a,b){ return a.quantity - b.quantity; });
    if(estoqueCategoriaFiltro !== "todas") list = list.filter(function(p){ return (p.category || "Sem categoria") === estoqueCategoriaFiltro; });
    if(q) list = list.filter(function(p){ return p.name.toLowerCase().indexOf(q) > -1; });

    document.getElementById("st-total-produtos").textContent = db.products.length;
    document.getElementById("st-baixo").textContent = db.products.filter(function(p){ return !p.unset && p.quantity <= p.minStock; }).length;

    var backupBanner = document.getElementById("banner-backup");
    var diasSemBackup = (Date.now() - getLastBackupTime()) / 86400000;
    var temAtividade = db.movements.length > 0 || db.products.some(function(p){ return !p.unset; });
    if(temAtividade && diasSemBackup > 3){
      backupBanner.style.display = "";
      backupBanner.innerHTML = "⚠️ Os dados ficam salvos só neste navegador, e o celular pode apagar sozinho de vez em quando. <b>Exporte um backup</b> pra não perder nada — toque em ⚙️ no topo e depois em Exportar backup.";
    } else {
      backupBanner.style.display = "none";
    }

    var unsetCount = db.products.filter(function(p){ return p.unset; }).length;
    var banner = document.getElementById("banner-conferir");
    if(unsetCount > 0){
      banner.style.display = "";
      banner.innerHTML = "📋 <b>" + unsetCount + " produtos</b> importados da sua lista de anotações ainda sem quantidade e preço conferidos. Abra cada um e toque em <b>Editar</b> pra completar — o nome e a categoria já estão prontos.";
    } else {
      banner.style.display = "none";
    }

    var el = document.getElementById("lista-produtos");
    if(list.length === 0){
      el.innerHTML = db.products.length === 0
        ? emptyState("🛍️", "Cadastre seu primeiro produto Wepink pra começar a controlar o estoque.", "Novo produto", "openProdutoSheet()")
        : emptyState("🔎", "Nenhum produto encontrado com esse filtro.", null, null);
      return;
    }
    el.innerHTML = list.map(function(p){
      var st = stockStatus(p);
      var statusColorVar = st === "neutral" ? "--text-2" : "--" + st;
      return (
        '<div class="card" data-id="' + p.id + '">' +
          '<div class="card-row">' +
            '<div>' +
              '<div class="card-title">' + escapeHtml(p.name) + '</div>' +
              '<div class="card-meta">' + escapeHtml(p.category || "Sem categoria") + '</div>' +
            '</div>' +
            '<span class="chip ' + st + '">' + (p.unset ? "conferir" : (p.quantity + ' un')) + '</span>' +
          '</div>' +
          '<div class="price-row">' +
            '<div class="item"><div class="k">Custo</div><div class="v tabular">' + fmtMoney(p.costPrice) + '</div></div>' +
            '<div class="item"><div class="k">Venda</div><div class="v tabular">' + fmtMoney(p.salePrice) + '</div></div>' +
            '<div class="item"><div class="k">Situação</div><div class="v" style="color:var(' + statusColorVar + ');font-size:12.5px;">' + stockLabel(p) + '</div></div>' +
          '</div>' +
          '<div class="card-actions">' +
            '<button class="btn soft" data-action="repor">↑ Repor</button>' +
            '<button class="btn soft" data-action="vender">↓ Vender</button>' +
            '<button class="btn ghost" data-action="editar">Editar</button>' +
          '</div>' +
        '</div>'
      );
    }).join("");
  }
  function emptyState(emoji, text, btnLabel, onclickJs){
    return (
      '<div class="empty-state"><span class="emoji">' + emoji + '</span><p>' + escapeHtml(text) + '</p>' +
      (btnLabel ? '<button class="btn primary" onclick="' + onclickJs + '">' + escapeHtml(btnLabel) + '</button>' : '') +
      '</div>'
    );
  }
  document.getElementById("search-produtos").addEventListener("input", renderEstoque);

  document.getElementById("lista-produtos").addEventListener("click", function(e){
    var card = e.target.closest(".card"); if(!card) return;
    var id = card.dataset.id;
    var p = db.products.find(function(x){ return x.id === id; });
    if(!p) return;
    var action = e.target.closest("[data-action]");
    if(!action) return;
    if(action.dataset.action === "editar") openProdutoSheet(p);
    else if(action.dataset.action === "repor") openMovimentoSheet(p, "compra");
    else if(action.dataset.action === "vender") openMovimentoSheet(p, "venda");
  });

  /* ---- Sheet: cadastro/edição de produto ---- */
  var movEditingId = null;
  function renderMovProduto(sheet, p){
    var el = sheet.querySelector("#lista-mov-produto");
    if(!el) return;
    var movs = db.movements.filter(function(m){ return m.productId === p.id; })
      .sort(function(a,b){ return b.createdAt - a.createdAt; });
    if(movs.length === 0){
      el.innerHTML = '<p style="font-size:12.5px;color:var(--text-muted);margin:0;">Nenhuma compra ou venda registrada pra este produto ainda.</p>';
      return;
    }
    el.innerHTML = movs.map(function(m){
      var isVenda = m.type === "venda";
      if(m.id === movEditingId){
        return (
          '<div class="card" data-mid="' + m.id + '" style="padding:10px 12px;">' +
            '<div class="card-title" style="font-size:13.5px;margin-bottom:8px;">' + (isVenda?"↓ Editar venda":"↑ Editar compra") + '</div>' +
            '<div class="field-row" style="margin-bottom:10px;">' +
              '<div class="field" style="margin-bottom:0;"><label>Quantidade</label><input type="number" min="1" id="mov-edit-qtd" value="' + m.quantity + '"></div>' +
              '<div class="field" style="margin-bottom:0;"><label>Preço unitário</label><input type="number" step="0.01" min="0" id="mov-edit-preco" value="' + m.unitPrice + '"></div>' +
            '</div>' +
            '<div class="field" style="margin-bottom:10px;"><label>Data</label><input type="date" id="mov-edit-data" value="' + m.date + '"></div>' +
            '<div class="sheet-actions" style="margin-top:0;">' +
              '<button class="btn ghost block" data-action="cancelar-edicao-mov">Cancelar</button>' +
              '<button class="btn primary block" data-action="salvar-edicao-mov">Salvar</button>' +
            '</div>' +
          '</div>'
        );
      }
      return (
        '<div class="card" data-mid="' + m.id + '" style="padding:10px 12px;flex-direction:row;align-items:center;justify-content:space-between;gap:10px;">' +
          '<div>' +
            '<div class="card-title" style="font-size:13.5px;">' + (isVenda?"↓ Venda":"↑ Compra") + ' · ' + m.quantity + ' un</div>' +
            '<div class="card-meta">' + fmtDateShort(m.date) + ' · ' + fmtMoney(m.unitPrice) + ' cada · total ' + fmtMoney(m.total) + '</div>' +
          '</div>' +
          '<div style="display:flex; gap:6px; flex:none;">' +
            '<button class="btn ghost" data-action="editar-mov" style="padding:6px 9px;">Editar</button>' +
            '<button class="btn danger" data-action="excluir-mov" style="padding:6px 10px;">✕</button>' +
          '</div>' +
        '</div>'
      );
    }).join("");

    el.querySelectorAll('[data-action="editar-mov"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        movEditingId = btn.closest(".card").dataset.mid;
        renderMovProduto(sheet, p);
      });
    });
    el.querySelectorAll('[data-action="cancelar-edicao-mov"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        movEditingId = null;
        renderMovProduto(sheet, p);
      });
    });
    el.querySelectorAll('[data-action="salvar-edicao-mov"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var card = btn.closest(".card");
        var mid = card.dataset.mid;
        var m = db.movements.find(function(x){ return x.id === mid; });
        if(!m) return;
        var novaQtd = parseInt(card.querySelector("#mov-edit-qtd").value, 10) || 0;
        var novoPreco = parseFloat(card.querySelector("#mov-edit-preco").value) || 0;
        var novaData = card.querySelector("#mov-edit-data").value || m.date;
        if(novaQtd <= 0){ toast("Quantidade precisa ser maior que zero"); return; }
        var delta = m.type === "venda" ? (m.quantity - novaQtd) : (novaQtd - m.quantity);
        p.quantity += delta;
        if(p.quantity < 0) p.quantity = 0;
        m.quantity = novaQtd; m.unitPrice = novoPreco; m.total = novaQtd*novoPreco; m.date = novaData;
        save();
        var qtdInput = sheet.querySelector("#f-qtd");
        if(qtdInput) qtdInput.value = p.quantity;
        movEditingId = null;
        renderMovProduto(sheet, p);
        renderAll();
        toast("Lançamento atualizado");
      });
    });
    el.querySelectorAll('[data-action="excluir-mov"]').forEach(function(btn){
      btn.addEventListener("click", function(){
        var card = btn.closest(".card");
        var mid = card.dataset.mid;
        var m = db.movements.find(function(x){ return x.id === mid; });
        if(!m) return;
        if(btn.dataset.confirming !== "1"){
          btn.dataset.confirming = "1";
          btn.textContent = "Confirmar?";
          setTimeout(function(){ if(btn.dataset.confirming==="1"){ btn.dataset.confirming=""; btn.textContent="✕"; } }, 3000);
          return;
        }
        p.quantity += m.type === "venda" ? m.quantity : -m.quantity;
        if(p.quantity < 0) p.quantity = 0;
        db.movements = db.movements.filter(function(x){ return x.id !== mid; });
        save();
        var qtdInput = sheet.querySelector("#f-qtd");
        if(qtdInput) qtdInput.value = p.quantity;
        renderMovProduto(sheet, p);
        renderAll();
        toast("Lançamento excluído");
      });
    });
  }

  window.openProdutoSheet = function(p){
    var editing = !!p;
    var sheet = openSheet(
      '<div class="sheet open">' +
        '<div class="sheet-head"><h3>' + (editing ? "Editar produto" : "Novo produto") + '</h3><button class="sheet-close" data-close>✕</button></div>' +
        '<div class="sheet-body">' +
          '<div class="field"><label>Nome do produto</label><input id="f-nome" type="text" placeholder="Ex: Base Wepink Matte 30ml" value="' + (editing?escapeHtml(p.name):"") + '"></div>' +
          '<div class="field"><label>Categoria</label><input id="f-categoria" list="dl-categorias" type="text" placeholder="Ex: Perfumaria" value="' + (editing?escapeHtml(p.category||""):"") + '">' +
            '<datalist id="dl-categorias">' + KNOWN_CATEGORIES.map(function(c){ return '<option value="' + escapeHtml(c) + '">'; }).join("") + '</datalist>' +
          '</div>' +
          '<div class="field-row">' +
            '<div class="field"><label>Preço de custo</label><input id="f-custo" type="number" step="0.01" min="0" inputmode="decimal" value="' + (editing?p.costPrice:"") + '"></div>' +
            '<div class="field"><label>Preço de venda</label><input id="f-venda" type="number" step="0.01" min="0" inputmode="decimal" value="' + (editing?p.salePrice:"") + '"></div>' +
          '</div>' +
          '<div class="field-row">' +
            '<div class="field"><label>' + (editing?"Quantidade atual":"Quantidade inicial") + '</label><input id="f-qtd" type="number" min="0" inputmode="numeric" value="' + (editing?p.quantity:0) + '"></div>' +
            '<div class="field"><label>Estoque mínimo</label><input id="f-minimo" type="number" min="0" inputmode="numeric" value="' + (editing?p.minStock:3) + '"></div>' +
          '</div>' +
          '<div class="field-hint">Estoque mínimo é o ponto em que ela aparece como "estoque baixo" no painel.</div>' +
          (!editing ? (
            '<div class="field"><label>Data da compra</label><input id="f-data-compra" type="date" value="' + todayISO() + '"></div>' +
            '<div class="field-hint" style="margin-top:-6px;">Se a quantidade inicial for maior que zero, isso registra automaticamente uma compra nessa data (aparece no Painel e no histórico do produto).</div>'
          ) : '') +
          (editing ? (
            '<div class="block-head" style="margin-top:18px;"><h2 style="font-size:14px;">Compras e vendas registradas</h2></div>' +
            '<div class="field-hint" style="margin-top:-6px;">Editar os campos acima <b>não</b> muda o que já foi registrado aqui. Pra corrigir um lançamento errado, apague ele nesta lista.</div>' +
            '<div class="list" id="lista-mov-produto" style="margin-bottom:18px;"></div>'
          ) : '') +
          '<div class="sheet-actions">' +
            (editing ? '<button class="btn danger" id="btn-excluir-produto">Excluir</button>' : '') +
            '<button class="btn primary block" id="btn-salvar-produto">' + (editing?"Salvar":"Cadastrar") + '</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
    if(editing){ movEditingId = null; renderMovProduto(sheet, p); }
    sheet.querySelector("#btn-salvar-produto").addEventListener("click", function(){
      var nome = sheet.querySelector("#f-nome").value.trim();
      if(!nome){ toast("Dá um nome pro produto"); return; }
      var custo = parseFloat(sheet.querySelector("#f-custo").value) || 0;
      var venda = parseFloat(sheet.querySelector("#f-venda").value) || 0;
      var qtd = parseInt(sheet.querySelector("#f-qtd").value, 10) || 0;
      var minimo = parseInt(sheet.querySelector("#f-minimo").value, 10) || 0;
      var categoria = sheet.querySelector("#f-categoria").value.trim();
      var savedId;
      if(editing){
        p.name = nome; p.category = categoria; p.costPrice = custo; p.salePrice = venda; p.quantity = qtd; p.minStock = minimo; p.unset = false;
        savedId = p.id;
      } else {
        savedId = uid();
        db.products.push({ id: savedId, name: nome, category: categoria, costPrice: custo, salePrice: venda, quantity: qtd, minStock: minimo, createdAt: Date.now() });
        if(qtd > 0){
          var dataCompra = sheet.querySelector("#f-data-compra").value || todayISO();
          db.movements.push({
            id: uid(), productId: savedId, productName: nome, type: "compra",
            quantity: qtd, unitPrice: custo, total: qtd*custo, date: dataCompra, note: "Estoque inicial", createdAt: Date.now()
          });
        }
      }
      save(); closeSheet(); renderAll();
      toast((editing ? "Produto atualizado: " : "Produto cadastrado: ") + nome);
      highlightProduct(savedId);
    });
    if(editing){
      sheet.querySelector("#btn-excluir-produto").addEventListener("click", function(){
        confirmDialog("Excluir produto", 'Tem certeza que quer excluir "' + p.name + '"? O histórico de movimentações dele continua salvo.', "Excluir", function(){
          db.products = db.products.filter(function(x){ return x.id !== p.id; });
          save(); renderAll(); toast("Produto excluído");
        }, true);
      });
    }
  };

  /* ---- Sheet: registrar movimento (compra/venda) ---- */
  window.openMovimentoSheet = function(preProduct, type){
    var isVenda = type === "venda";
    var options = db.products.map(function(p){
      return '<option value="' + p.id + '"' + (preProduct && preProduct.id===p.id ? " selected":"") + '>' + escapeHtml(p.name) + ' (' + p.quantity + ' un)</option>';
    }).join("");
    var sheet = openSheet(
      '<div class="sheet open">' +
        '<div class="sheet-head"><h3>' + (isVenda?"Registrar venda":"Repor estoque") + '</h3><button class="sheet-close" data-close>✕</button></div>' +
        '<div class="sheet-body">' +
          '<div class="field"><label>Produto</label><select id="f-produto">' + options + '</select></div>' +
          '<div class="field-row">' +
            '<div class="field"><label>Quantidade</label><input id="f-qtd" type="number" min="1" inputmode="numeric" value="1"></div>' +
            '<div class="field"><label>Preço unitário</label><input id="f-preco" type="number" step="0.01" min="0" inputmode="decimal" value="' + (preProduct ? (isVenda?preProduct.salePrice:preProduct.costPrice) : "") + '"></div>' +
          '</div>' +
          '<div class="field"><label>Data</label><input id="f-data" type="date" value="' + todayISO() + '"></div>' +
          '<div class="field"><label>Observação (opcional)</label><input id="f-obs" type="text" placeholder="Ex: reposição fornecedor"></div>' +
          '<button class="btn primary block lg" id="btn-salvar-mov">' + (isVenda?"Registrar venda":"Registrar entrada") + '</button>' +
        '</div>' +
      '</div>'
    );
    var selEl = sheet.querySelector("#f-produto");
    selEl.addEventListener("change", function(){
      var prod = db.products.find(function(x){ return x.id === selEl.value; });
      if(prod) sheet.querySelector("#f-preco").value = isVenda ? prod.salePrice : prod.costPrice;
    });
    sheet.querySelector("#btn-salvar-mov").addEventListener("click", function(){
      var prod = db.products.find(function(x){ return x.id === selEl.value; });
      if(!prod){ toast("Escolha um produto"); return; }
      var qtd = parseInt(sheet.querySelector("#f-qtd").value, 10) || 0;
      if(qtd <= 0){ toast("Quantidade precisa ser maior que zero"); return; }
      if(isVenda && qtd > prod.quantity){
        toast("Estoque insuficiente: só há " + prod.quantity + " un de " + prod.name); return;
      }
      var preco = parseFloat(sheet.querySelector("#f-preco").value) || 0;
      var data = sheet.querySelector("#f-data").value || todayISO();
      var obs = sheet.querySelector("#f-obs").value.trim();
      prod.quantity += isVenda ? -qtd : qtd;
      prod.unset = false;
      db.movements.push({
        id: uid(), productId: prod.id, productName: prod.name, type: isVenda?"venda":"compra",
        quantity: qtd, unitPrice: preco, total: qtd*preco, date: data, note: obs, createdAt: Date.now()
      });
      save(); closeSheet(); renderAll();
      toast((isVenda ? "Venda registrada: " : "Entrada registrada: ") + prod.name + " (agora " + prod.quantity + " un)");
      highlightProduct(prod.id);
    });
  };

  /* ===================== PAINEL: render ===================== */
  var MESES_NOMES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

  function matchesPeriodo(dateStr){
    if(!dateStr) return false;
    var y = dateStr.slice(0,4), m = dateStr.slice(5,7), d = dateStr.slice(8,10);
    if(painelAno !== "todos" && y !== painelAno) return false;
    if(painelMes !== "todos" && m !== painelMes) return false;
    if(painelDia !== "todos" && d !== painelDia) return false;
    return true;
  }
  function diasNoMes(ano, mes){
    return new Date(parseInt(ano,10), parseInt(mes,10), 0).getDate();
  }
  function renderPeriodoControles(){
    var today = todayISO();
    var anoAtual = parseInt(today.slice(0,4), 10);

    var anosComDados = db.movements.map(function(m){ return parseInt(m.date.slice(0,4), 10); }).filter(function(y){ return !isNaN(y); });
    var anoMinimo = anosComDados.length ? Math.min(anoAtual, Math.min.apply(null, anosComDados)) : anoAtual;
    var optsAno = '<option value="todos"' + (painelAno==="todos"?" selected":"") + '>Todos</option>';
    for(var y = anoAtual; y >= anoMinimo; y--){
      optsAno += '<option value="' + y + '"' + (String(y)===painelAno?" selected":"") + '>' + y + '</option>';
    }

    var optsMes = '<option value="todos"' + (painelMes==="todos"?" selected":"") + '>Todos</option>';
    MESES_NOMES.forEach(function(nome, i){
      var v = String(i+1).padStart(2,"0");
      optsMes += '<option value="' + v + '"' + (v===painelMes?" selected":"") + '>' + nome + '</option>';
    });

    var diaHabilitado = painelAno !== "todos" && painelMes !== "todos";
    var optsDia = '<option value="todos"' + (painelDia==="todos"?" selected":"") + '>Todos</option>';
    if(diaHabilitado){
      var totalDias = diasNoMes(painelAno, painelMes);
      for(var d = 1; d <= totalDias; d++){
        var vd = String(d).padStart(2,"0");
        optsDia += '<option value="' + vd + '"' + (vd===painelDia?" selected":"") + '>' + d + '</option>';
      }
    } else {
      painelDia = "todos";
    }

    document.getElementById("periodo-box").innerHTML =
      '<div class="periodo-col"><div class="lbl">Ano</div><select id="f-periodo-ano">' + optsAno + '</select></div>' +
      '<div class="periodo-col"><div class="lbl">Mês</div><select id="f-periodo-mes">' + optsMes + '</select></div>' +
      '<div class="periodo-col"><div class="lbl">Dia</div><select id="f-periodo-dia"' + (diaHabilitado?"":" disabled") + '>' + optsDia + '</select></div>';

    document.getElementById("f-periodo-ano").addEventListener("change", function(){
      painelAno = this.value; renderPainel();
    });
    document.getElementById("f-periodo-mes").addEventListener("change", function(){
      painelMes = this.value; renderPainel();
    });
    document.getElementById("f-periodo-dia").addEventListener("change", function(){
      painelDia = this.value; renderPainel();
    });
  }

  function renderPainel(){
    renderPeriodoControles();
    var ganhoMes = 0, gastoMes = 0;
    db.movements.forEach(function(m){
      if(!matchesPeriodo(m.date)) return;
      if(m.type === "venda") ganhoMes += m.total;
      else gastoMes += m.total;
    });
    document.getElementById("pn-ganho").textContent = fmtMoney(ganhoMes);
    document.getElementById("pn-gasto").textContent = fmtMoney(gastoMes);
    var lucroEl = document.getElementById("pn-lucro");
    lucroEl.textContent = fmtMoney(ganhoMes - gastoMes);
    lucroEl.className = "value tabular " + (ganhoMes-gastoMes >= 0 ? "good" : "critical");

    var investido = 0, potencial = 0;
    db.products.forEach(function(p){ investido += p.costPrice*p.quantity; potencial += p.salePrice*p.quantity; });
    document.getElementById("pn-investido").textContent = fmtMoney(investido);
    document.getElementById("pn-potencial").textContent = fmtMoney(potencial);

    renderChartMeses();
    renderMaisVendidos();
    renderBaixoEstoquePainel();
  }

  function renderChartMeses(){
    var months = [];
    var now = new Date();
    for(var i=11;i>=0;i--){
      var d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      months.push({ key: d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"), label: d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","") });
    }
    var data = months.map(function(m){
      var ganho=0, gasto=0;
      db.movements.forEach(function(mv){
        if(monthKey(mv.date) !== m.key) return;
        if(mv.type==="venda") ganho += mv.total; else gasto += mv.total;
      });
      return { label:m.label, ganho:ganho, gasto:gasto };
    });
    var maxVal = Math.max(1, Math.max.apply(null, data.map(function(d){ return Math.max(d.ganho,d.gasto); })));

    var W = 560, H = 180, padL = 8, padR = 8, padT = 22, padB = 26;
    var groupW = (W - padL - padR) / data.length;
    var barW = Math.min(20, groupW*0.32);
    var chartH = H - padT - padB;

    var svgns = "http://www.w3.org/2000/svg";
    var svg = document.getElementById("chart-meses");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.innerHTML = "";

    // baseline
    var base = document.createElementNS(svgns,"line");
    base.setAttribute("x1", padL); base.setAttribute("x2", W-padR);
    base.setAttribute("y1", H-padB); base.setAttribute("y2", H-padB);
    base.style.stroke = "var(--border-strong)"; base.setAttribute("stroke-width","1");
    svg.appendChild(base);

    data.forEach(function(d, i){
      var cx = padL + groupW*i + groupW/2;
      [["ganho","var(--series-ganho)",-1],["gasto","var(--series-gasto)",1]].forEach(function(spec){
        var key=spec[0], color=spec[1], dir=spec[2];
        var val = d[key];
        var h = maxVal>0 ? (val/maxVal)*chartH : 0;
        var x = cx + dir*(barW/2 + 1) - (dir<0?barW:0);
        var y = H - padB - h;
        var rect = document.createElementNS(svgns,"rect");
        rect.setAttribute("x", x); rect.setAttribute("y", y);
        rect.setAttribute("width", barW); rect.setAttribute("height", Math.max(h,1));
        rect.setAttribute("rx", 4); rect.style.fill = color;
        svg.appendChild(rect);
        if(val > 0){
          var lbl = document.createElementNS(svgns,"text");
          lbl.setAttribute("x", x + barW/2); lbl.setAttribute("y", y - 5);
          lbl.setAttribute("text-anchor","middle"); lbl.setAttribute("font-size","9.5");
          lbl.setAttribute("font-weight","700"); lbl.style.fill = "var(--text-2)";
          lbl.textContent = val >= 1000 ? (val/1000).toFixed(1).replace(".0","")+"k" : val.toFixed(0);
          svg.appendChild(lbl);
        }
      });
      var t = document.createElementNS(svgns,"text");
      t.setAttribute("x", cx); t.setAttribute("y", H-8);
      t.setAttribute("text-anchor","middle"); t.setAttribute("font-size","10.5");
      t.setAttribute("font-weight","600"); t.style.fill = "var(--text-muted)";
      t.textContent = d.label;
      svg.appendChild(t);
    });
  }

  function renderMaisVendidos(){
    var qtyByProduct = {};
    db.movements.forEach(function(m){
      if(m.type !== "venda") return;
      qtyByProduct[m.productName] = (qtyByProduct[m.productName]||0) + m.quantity;
    });
    var arr = Object.keys(qtyByProduct).map(function(k){ return { name:k, qty:qtyByProduct[k] }; })
      .sort(function(a,b){ return b.qty-a.qty; }).slice(0,5);
    var el = document.getElementById("lista-mais-vendidos");
    if(arr.length === 0){
      el.innerHTML = '<p style="font-size:13px;color:var(--text-2);margin:4px 0;">Nenhuma venda registrada ainda.</p>';
      return;
    }
    var max = arr[0].qty;
    el.innerHTML = arr.map(function(a){
      return (
        '<div class="hbar-row">' +
          '<div class="hbar-top"><span class="name">' + escapeHtml(a.name) + '</span><span class="qty">' + a.qty + ' un</span></div>' +
          '<div class="hbar-track"><div class="hbar-fill" style="width:' + Math.max(6,(a.qty/max)*100) + '%"></div></div>' +
        '</div>'
      );
    }).join("");
  }

  function renderBaixoEstoquePainel(){
    var baixo = db.products.filter(function(p){ return !p.unset && p.quantity <= p.minStock; }).sort(function(a,b){ return a.quantity-b.quantity; });
    var block = document.getElementById("block-baixo-estoque");
    if(baixo.length === 0){ block.style.display = "none"; return; }
    block.style.display = "";
    document.getElementById("lista-baixo-painel").innerHTML = baixo.map(function(p){
      var st = stockStatus(p);
      return (
        '<div class="card" style="padding:11px 14px;">' +
          '<div class="card-row" style="align-items:center;">' +
            '<div class="card-title" style="font-size:14px;">' + escapeHtml(p.name) + '</div>' +
            '<span class="chip ' + st + '">' + p.quantity + ' un</span>' +
          '</div>' +
        '</div>'
      );
    }).join("");
  }

  /* ===================== Backup sheet ===================== */
  function openCategoriasSheet(){
    var cats = KNOWN_CATEGORIES.slice();
    db.products.forEach(function(p){
      var c = p.category || "Sem categoria";
      if(cats.indexOf(c) === -1) cats.push(c);
    });
    var rows = '<button class="cm-all" data-cat="todas"><span class="cm-icon">🛍️</span><span class="cm-label">Todos os produtos</span><span class="cm-chevron">›</span></button>' +
      cats.map(function(c){
        var icon = CATEGORY_ICONS[c] || "✨";
        return '<button data-cat="' + escapeHtml(c) + '"><span class="cm-icon">' + icon + '</span><span class="cm-label">' + escapeHtml(c) + '</span><span class="cm-chevron">›</span></button>';
      }).join("");
    var sheet = openSheet(
      '<div class="sheet open">' +
        '<div class="sheet-head"><h3>Categorias</h3><button class="sheet-close" data-close>✕</button></div>' +
        '<div class="sheet-body"><div class="cat-menu">' + rows + '</div></div>' +
      '</div>'
    );
    sheet.querySelectorAll(".cat-menu button").forEach(function(btn){
      btn.addEventListener("click", function(){
        estoqueCategoriaFiltro = btn.dataset.cat;
        closeSheet();
        setTab("estoque");
      });
    });
  }

  function openBackupSheet(){
    var sheet = openSheet(
      '<div class="sheet open">' +
        '<div class="sheet-head"><h3>Backup e dados</h3><button class="sheet-close" data-close>✕</button></div>' +
        '<div class="sheet-body">' +
          '<div class="help-box">Os dados ficam salvos <b>só neste aparelho e neste navegador</b>. Pra usar no tablet e no celular ao mesmo tempo, exporte um backup de um aparelho e importe no outro de vez em quando — a importação <b>mescla</b> os dados, sem apagar o que já existe.</div>' +
          '<button class="btn soft block lg" id="btn-exportar" style="margin-bottom:10px;">⬇️ Exportar backup</button>' +
          '<label class="btn soft block lg" style="margin-bottom:22px;display:flex;">⬆️ Importar backup<input type="file" id="input-importar" accept="application/json" style="display:none;"></label>' +
          '<div class="block-head"><h2 style="font-size:14px;">Zona de risco</h2></div>' +
          '<button class="btn danger block" id="btn-limpar">Apagar todos os dados deste aparelho</button>' +
        '</div>' +
      '</div>'
    );
    sheet.querySelector("#btn-exportar").addEventListener("click", function(){ exportBackup(); });
    sheet.querySelector("#input-importar").addEventListener("change", function(e){
      var file = e.target.files[0]; if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        try{
          var incoming = JSON.parse(reader.result);
          mergeImport(incoming);
          save(); closeSheet(); renderAll();
          toast("Backup importado e mesclado");
        }catch(err){ toast("Arquivo inválido"); }
      };
      reader.readAsText(file);
    });
    sheet.querySelector("#btn-limpar").addEventListener("click", function(){
      confirmDialog("Apagar todos os dados", "Isso vai apagar produtos e movimentações deste aparelho. Essa ação não pode ser desfeita. Exporte um backup antes, se quiser.", "Apagar tudo", function(){
        db = { products: [], movements: [] };
        save(); renderAll(); toast("Dados apagados");
      }, true);
    });
  }
  function exportBackup(){
    var filename = "vitrine-backup-" + todayISO() + ".json";
    var json = JSON.stringify(db, null, 2);
    var blob = new Blob([json], {type:"application/json"});

    var canNativeShare = false;
    try{
      canNativeShare = !!(navigator.share && navigator.canShare && navigator.canShare({ files: [new File([blob], filename, {type:"application/json"})] }));
    }catch(e){ canNativeShare = false; }

    if(canNativeShare){
      navigator.share({ files: [new File([blob], filename, {type:"application/json"})], title: "Backup Vitrine" })
        .then(function(){ markBackupDone(); renderAll(); toast("Backup compartilhado"); })
        .catch(function(err){
          if(err && err.name === "AbortError") return;
          downloadOrShowText(blob, json, filename);
        });
      return;
    }
    downloadOrShowText(blob, json, filename);
  }

  function downloadOrShowText(blob, json, filename){
    try{
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      markBackupDone(); renderAll();
      toast("Backup baixado");
    }catch(err){
      showBackupText(json, filename);
    }
  }

  function showBackupText(json, filename){
    var sheet = openSheet(
      '<div class="sheet open">' +
        '<div class="sheet-head"><h3>Copiar backup</h3><button class="sheet-close" data-close>✕</button></div>' +
        '<div class="sheet-body">' +
          '<div class="help-box">Não consegui baixar o arquivo direto neste navegador. Copie o texto abaixo e cole num app de notas ou mensagem pra guardar — depois é só colar de volta na importação.</div>' +
          '<div class="field"><textarea id="f-backup-text" readonly style="min-height:180px;font-size:11.5px;font-family:monospace;" onclick="this.select()">' + escapeHtml(json) + '</textarea></div>' +
          '<button class="btn primary block" id="btn-copiar-backup">Copiar texto</button>' +
        '</div>' +
      '</div>'
    );
    sheet.querySelector("#btn-copiar-backup").addEventListener("click", function(){
      var ta = sheet.querySelector("#f-backup-text");
      ta.select();
      var done = false;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(json).then(function(){ toast("Copiado"); }).catch(function(){ toast("Selecione e copie manualmente"); });
        done = true;
      }
      if(!done){
        try{ document.execCommand("copy"); toast("Copiado"); }catch(e){ toast("Selecione e copie manualmente"); }
      }
    });
  }

  function mergeImport(incoming){
    ["products","movements"].forEach(function(key){
      var incomingArr = incoming[key] || [];
      var localById = {};
      db[key].forEach(function(item){ localById[item.id] = item; });
      incomingArr.forEach(function(item){ localById[item.id] = item; });
      db[key] = Object.values(localById);
    });
  }

  /* ===================== Render all ===================== */
  function renderAll(){
    if(currentTab === "estoque") renderEstoque();
    else if(currentTab === "painel") renderPainel();
  }

  /* ===================== Init ===================== */
  load();
  setTab("estoque");
})();
</script>
